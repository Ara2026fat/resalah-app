  <style>
/* رموز التصميم. نظام الأسطح الزجاجية مأخوذ من «أُفق»، والمظهر النهاري من لغة AIR LAB (ورق كريمي وحدود ذهبية وأزرار ملموسة).
   ألوان الهوية (أزرق #0C9CE4 وأخضر #84CC54 وبرتقالي #F59A35) مأخوذة من صورة الشعار المنشورة؛ تُضبط من ملف الشعار الأصلي عند استلامه.
   .on-dark و.site-head يعيدان القيم الليلية داخل المظهر النهاري: جزر داكنة تعطي الصفحة عمقًا. */
:root, [data-theme="night"], .on-dark, .site-head {
  color-scheme: dark;
  --void: #071b2b;
  --page: #071b2b;
  --page-bg: radial-gradient(900px 460px at 88% -140px, rgba(12,156,228,.12), transparent 70%), radial-gradient(700px 420px at -10% 38%, rgba(132,204,84,.07), transparent 70%), #071b2b;
  --lift1: #0d2a40;
  --ink: #dde9f0;
  --ink-soft: #9db8c9;
  --ink-faint: #7b98ab;
  --head: #f3f8fc;
  --link: #7cc8f4;

  --glass: linear-gradient(158deg, rgba(255,255,255,.062), rgba(255,255,255,.022));
  --glass-line: rgba(255,255,255,.085);
  --glass-shadow: 0 18px 46px rgba(0,0,0,.42);
  --edge: rgba(255,255,255,.18);
  --flat: rgba(255,255,255,.035);
  --flat-line: rgba(255,255,255,.07);
  --line: rgba(255,255,255,.1);
  --solid: #0d2a40;
  --card-shadow: none;

  --glow: #f59a35;
  --glow-tint: rgba(245,154,53,.14);
  --gold-text: #ffb04d;
  --btn-bg: rgba(12,156,228,.18);
  --btn-line: rgba(12,156,228,.5);
  --btn-ink: #b8e4fb;

  --field-bg: rgba(255,255,255,.05);
  --field-line: rgba(255,255,255,.2);
  --focus: #ffb04d;

  --c-tarbawi: #84cc54;
  --c-ilmi: #3fb4f0;
  --c-khayri: #f59a35;
  --c-mujtama: #b79bf0;

  --ok: #62d3a4; --ok-bg: rgba(98,211,164,.14);
  --warn: #f2b865; --warn-bg: rgba(242,184,101,.14);
  --danger: #f39a8c; --danger-line: rgba(243,154,140,.4);
}

[data-theme="day"] {
  color-scheme: light;
  --void: #eef6fb;
  --page: #eef6fb;
  --page-bg: radial-gradient(900px 440px at 90% -100px, rgba(12,156,228,.16), transparent 72%), radial-gradient(760px 420px at -8% 30%, rgba(132,204,84,.14), transparent 72%), radial-gradient(600px 300px at 50% 100%, rgba(245,154,53,.10), transparent 72%), #eef6fb;
  --lift1: #ffffff;
  --ink: #0a2236;
  --ink-soft: #46647a;
  --ink-faint: #5a7589;
  --head: #0a2d4a;
  --link: #0b6fa8;

  --glass: linear-gradient(158deg, #ffffff, #e6f3fb);
  --glass-line: #a9d3ea;
  --glass-shadow: inset 0 1px 0 #fff, 0 12px 24px -14px rgba(10,60,100,.45);
  --edge: rgba(255,255,255,1);
  --flat: #ffffff;
  --flat-line: #b5d6e8;
  --line: #c6e0ee;
  --solid: #ffffff;
  --card-shadow: inset 0 1px 0 #fff, 0 12px 22px -14px rgba(10,60,100,.45);

  --glow: #d9760f;
  --glow-tint: rgba(245,154,53,.18);
  --gold-text: #b25a00;
  --btn-bg: #0a2d4a;
  --btn-line: #0a2d4a;
  --btn-ink: #ffffff;

  --field-bg: #fbfeff;
  --field-line: #8fbdd6;
  --focus: #d9760f;

  --c-tarbawi: #3f8f1a;
  --c-ilmi: #0a78b8;
  --c-khayri: #c8650a;
  --c-mujtama: #7a55c9;

  --ok: #0e7a55; --ok-bg: #ddf2e6;
  --warn: #8a5400; --warn-bg: #fcefcb;
  --danger: #a33a2b; --danger-line: #e3b7ae;
}

:root {
  --hero-1: #0d3a5c; --hero-2: #05172a;
  --gold-hi: #ffb04d;
  --brand-blue: #0c9ce4; --brand-green: #84cc54; --brand-orange: #f59a35;
  --font-body: 'IBM Plex Sans Arabic', 'Segoe UI', 'Noto Sans Arabic', Tahoma, system-ui, sans-serif;
  --font-display: 'Aref Ruqaa', 'Noto Naskh Arabic', 'Amiri', serif;

  --step--1: clamp(0.84rem, 0.82rem + 0.1vw, 0.9rem);
  --step-0: clamp(1rem, 0.97rem + 0.15vw, 1.08rem);
  --step-1: clamp(1.2rem, 1.1rem + 0.5vw, 1.45rem);
  --step-2: clamp(1.5rem, 1.3rem + 1vw, 2rem);
  --step-3: clamp(2rem, 1.6rem + 2vw, 3rem);

  --r: 14px;
  --r-sm: 10px;
  --gutter: 16px;
  --tabbar-h: 62px;
  --head-h: 64px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; background: var(--void); }
body { margin: 0; background: var(--page-bg); color: var(--ink); font: 400 var(--step-0)/1.8 var(--font-body); min-height: 100vh; padding-block-end: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); font-variant-numeric: tabular-nums; }
img { max-width: 100%; display: block; }
a { color: var(--link); text-underline-offset: 3px; }
h1, h2, h3 { line-height: 1.35; margin: 0 0 .5em; font-weight: 600; color: var(--head); }
h1 { font-size: var(--step-3); } h2 { font-size: var(--step-2); } h3 { font-size: var(--step-1); }
p { margin: 0 0 1em; }
.display { font-family: var(--font-display); font-weight: 700; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; inset-inline-start: 8px; top: -60px; background: var(--gold-hi); color: #2a1200; padding: 10px 14px; z-index: 100; border-radius: var(--r-sm); }
.skip:focus { top: 8px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
main:focus { outline: none; }
.muted { color: var(--ink-soft); } .muted-on-dark { color: #a9c3c6; }
.wrap { max-width: 1120px; margin-inline: auto; padding: 24px var(--gutter) 40px; }
.wrap.narrow { max-width: 760px; }
.lead { font-size: var(--step-1); line-height: 1.9; color: var(--ink); max-width: 68ch; }
.meta { color: var(--ink-soft); font-size: var(--step--1); margin: 0 0 .5em; }
.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.i { flex: none; vertical-align: -4px; }

/* ====== الرأس ====== */
.site-head { position: sticky; top: 0; z-index: 30; background: linear-gradient(180deg, var(--hero-1), var(--hero-2)); border-bottom: 1px solid var(--line); }
.site-head::after { content: ''; position: absolute; inset: auto 0 -3px; height: 3px; background: linear-gradient(90deg, var(--brand-blue) 0 33.3%, var(--brand-green) 33.3% 66.6%, var(--brand-orange) 66.6%); }
.head-in { max-width: 1120px; margin-inline: auto; padding: 8px var(--gutter); display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--head); margin-inline-end: auto; }
.logo { width: 40px; height: 40px; object-fit: contain; border-radius: 50%; }
.logo-fallback { display: inline-grid; place-items: center; background: linear-gradient(160deg, var(--hero-1), var(--hero-2)); color: var(--gold-hi); font: 700 1.4rem var(--font-display); border: 1.5px solid var(--gold-hi); }
.brand-text { display: grid; line-height: 1.2; }
.brand-text strong { font: 700 1.35rem var(--font-display); }
.brand-text small { color: var(--ink-soft); font-size: .75rem; }
.top-nav { display: none; gap: 4px; }
.top-nav a { padding: 8px 12px; text-decoration: none; color: var(--ink); border-radius: var(--r-sm); font-weight: 500; transition: background-color .16s ease; }
.top-nav a:hover { background: var(--flat); }
.top-nav a.on { color: var(--head); box-shadow: inset 0 -3px 0 var(--glow); border-radius: 0; }
.head-cta { padding: 8px 16px; min-height: 40px; }
.theme-btn { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--flat); color: var(--ink); border-radius: 50%; cursor: pointer; transition: transform .12s ease; }
.theme-btn:active { transform: scale(.94); }

/* ====== الأزرار ====== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 20px; border: 1.5px solid transparent; border-radius: 14px; font: 600 var(--step-0)/1.3 var(--font-body); text-decoration: none; cursor: pointer; transition: background-color .16s ease, border-color .16s ease, transform .12s ease, filter .16s ease; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.988); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--btn-bg); border-color: var(--btn-line); color: var(--btn-ink); }
.btn-quiet { background: var(--flat); color: var(--ink); border-color: var(--line); }
.btn-quiet:hover { border-color: var(--glow); }
.btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--danger-line); }
[data-theme="day"] .btn-primary { color: #fff; border: 2.5px solid transparent;
  background: linear-gradient(180deg, #0f4468, #0a2d4a) padding-box, linear-gradient(135deg, #ffe3c0, #b85f08 55%, #ffb85a) border-box;
  box-shadow: 0 4px 0 #051523, 0 10px 16px -8px rgba(10,45,74,.6); }
[data-theme="day"] .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #051523; }
[data-theme="day"] .chip.on, [data-theme="day"] .leg.on { background: #0a2d4a; color: #fff; border-color: #f59a35; }
/* الزر الذهبي: حدّ متدرّج وظل سفلي ملموس (من AIR LAB) */
.btn-gold { color: #2a1200; border: 2.5px solid transparent; font-weight: 700;
  background: linear-gradient(180deg, #ffc88a, #f59a35 50%, #e0801a) padding-box, linear-gradient(135deg, #ffe3c0, #b85f08 55%, #ffb85a) border-box;
  box-shadow: 0 4px 0 #9a4f06, 0 10px 16px -8px rgba(154,79,6,.65); }
.btn-gold:hover { filter: brightness(1.05); }
.btn-gold:active { transform: translateY(3px); box-shadow: 0 1px 0 #9a4f06; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-block: 18px; }
.linklike { background: none; border: 0; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }

/* ====== الواجهة العلوية: مغلف رسالة بغطاء مثلثي ====== */
.hero { position: relative; color: #fff; background: radial-gradient(520px 340px at 78% 38%, rgba(245,154,53,.20), transparent 70%), linear-gradient(180deg, var(--hero-1), var(--hero-2)); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 34px), 50% 100%, 0 calc(100% - 34px)); padding: 44px var(--gutter) 84px; }
.band::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 5px; background: linear-gradient(90deg, var(--brand-blue) 0 33.3%, var(--brand-green) 33.3% 66.6%, var(--brand-orange) 66.6%); }
.hero-logo { display: block; width: min(86%, 440px); height: auto; margin: 6px auto 10px; animation: unseal 1.1s cubic-bezier(.2,.7,.2,1) both; }
.brand .logo-mark { height: 40px; width: auto; display: block; }
.foot-logo { width: 220px; max-width: 100%; height: auto; display: block; }
.hero-in { position: relative; max-width: 1120px; margin-inline: auto; }
.hero-org { color: #b9d6e6; font-size: var(--step--1); margin: 0 0 .5em; }
.hero-in { z-index: 1; }
.hero-grid { display: grid; gap: 8px; text-align: start; }
.hero-word-unused { font: 700 clamp(5.5rem, 26vw, 13rem)/1.05 var(--font-display); color: var(--gold-hi); margin: 0 0 .1em; animation: unseal .9s cubic-bezier(.2,.7,.2,1) both; }
.hero-side { align-self: end; padding-bottom: .6em; }
.hero-mission { font-size: var(--step-1); max-width: 40ch; line-height: 1.9; color: #e8f0ef; }
@keyframes unseal { from { clip-path: inset(0 0 0 100%); opacity: 0; } to { clip-path: inset(0); opacity: 1; } }

/* ====== أقسام ====== */
.hero + .wrap { padding-top: 0; }
.hero + .wrap > .block:first-child { margin-top: -58px; position: relative; z-index: 2; }
.block { margin-block: 36px; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.block-head h1, .block-head h2 { margin: 0; }
.more { font-weight: 600; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; color: var(--gold-text); }
.more:hover { text-decoration: underline; }
.pagehead { margin-bottom: 20px; }
.pagehead h1 { font-family: var(--font-display); font-weight: 700; }
.crumb { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; color: var(--ink-soft); font-size: var(--step--1); margin-bottom: 8px; }
.crumb .i { transform: scaleX(-1); }
.paths { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.path { box-shadow: var(--card-shadow); display: grid; gap: 4px; align-content: start; background: var(--solid); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; text-decoration: none; color: var(--ink); transition: border-color .16s ease, transform .12s ease; }
.path:hover { border-color: var(--glow); }
.path:active { transform: scale(.988); }
.path .i { color: var(--gold-text); }
.path strong { font-size: var(--step-0); color: var(--head); }
.path span { font-size: var(--step--1); color: var(--ink-soft); line-height: 1.6; }

/* لافتة التبرع: حدّ ذهبي متدرّج ونقش هندسي (من AIR LAB) */
.band { position: relative; overflow: hidden; color: #fff; border: 3px solid transparent; border-radius: 22px; margin-block: 36px; padding: 24px 20px;
  background: linear-gradient(180deg, #0f4468, #0a2d4a 65%, #051523) padding-box, linear-gradient(135deg, #ffe3c0, #f59a35 45%, #a85a08 60%, #ffc88a) border-box;
  box-shadow: 0 10px 20px -10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.18); }
.band-in { position: relative; display: grid; gap: 16px; }
.band h2 { color: #fff; } .band p { color: #dbe8e8; max-width: 62ch; margin: 0; }

/* ====== السطح الزجاجي (من أُفق): تدرّج + حافة ضوء + ظل. زجاج واحد في الشاشة ====== */
.glass { position: relative; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 26px; box-shadow: var(--glass-shadow); padding: 24px 16px; }
.glass::before { content: ''; position: absolute; inset: 0 14% auto; height: 1px; border-radius: 1px; background: linear-gradient(90deg, transparent, var(--edge), transparent); }

/* ====== عجلة البرامج ====== */
.wheel-stage { display: grid; gap: 18px; }
.wheel-svg { display: block; width: 100%; max-width: 440px; margin-inline: auto; height: auto; overflow: visible; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; }
.wheel-svg.drag { cursor: grabbing; }
.ring { transform-origin: 200px 200px; transform: rotate(var(--rot, 0deg)); will-change: transform; }
.lbl { transform: rotate(calc(var(--rot, 0deg) * -1)); }
.wheel-pointer { fill: var(--gold-hi); filter: drop-shadow(0 0 6px rgba(245,154,53,.8)); }
.wheel-ctrl { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
.wheel-ctrl .btn { min-height: 40px; padding: 6px 14px; font-size: var(--step--1); }
.seg { cursor: pointer; outline: none; transform-origin: 200px 200px; animation: wIn .7s cubic-bezier(.2,.9,.25,1) both; animation-delay: calc(var(--i) * 60ms); transition: opacity .16s ease; }
.seg[data-c="tarbawi"] { --c: var(--c-tarbawi); } .seg[data-c="ilmi"] { --c: var(--c-ilmi); }
.seg[data-c="khayri"] { --c: var(--c-khayri); } .seg[data-c="mujtama"] { --c: var(--c-mujtama); }
.seg path { fill: var(--c, var(--glow)); fill-opacity: .17; stroke: var(--c, var(--glow)); stroke-opacity: .55; stroke-width: 1.2; transition: fill-opacity .16s ease, stroke-width .16s ease; }
.seg:hover path { fill-opacity: .3; }
.seg:focus-visible path { stroke-width: 3; stroke-opacity: 1; }
.seg.on path { fill-opacity: .46; stroke-opacity: 1; stroke-width: 2.2; filter: drop-shadow(0 0 7px var(--c)); }
.seg text { fill: var(--head); font: 600 14.5px var(--font-body); text-anchor: middle; pointer-events: none; }
.seg.on text { font-weight: 700; }
.wheel-svg[data-focus="tarbawi"] .seg:not([data-c="tarbawi"]), .wheel-svg[data-focus="ilmi"] .seg:not([data-c="ilmi"]),
.wheel-svg[data-focus="khayri"] .seg:not([data-c="khayri"]), .wheel-svg[data-focus="mujtama"] .seg:not([data-c="mujtama"]) { opacity: .25; }
.wheel-core { fill: var(--solid); stroke: var(--glow); stroke-opacity: .4; stroke-width: 1.5; }
.wheel-ring { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 6; }
.wheel-word { fill: var(--gold-text); font: 700 46px var(--font-display); text-anchor: middle; }
.wheel-sub { fill: var(--ink-soft); font: 500 12px var(--font-body); text-anchor: middle; }
@keyframes wIn { from { opacity: 0; transform: scale(.86) rotate(-10deg); } to { opacity: 1; transform: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.leg { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--flat); color: var(--ink); border-radius: 99px; padding: 6px 14px; min-height: 38px; font: 500 var(--step--1) var(--font-body); cursor: pointer; transition: border-color .16s ease, transform .12s ease; }
.leg:active { transform: scale(.988); }
.leg.on { border-color: var(--glow); background: var(--glow-tint); }
.leg i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.leg[data-c="tarbawi"] { --c: var(--c-tarbawi); } .leg[data-c="ilmi"] { --c: var(--c-ilmi); } .leg[data-c="khayri"] { --c: var(--c-khayri); } .leg[data-c="mujtama"] { --c: var(--c-mujtama); }
.wheel-card { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; padding: 16px 18px; background: var(--flat); border: 1px solid var(--flat-line); border-radius: 16px; }
.wheel-card h3 { margin: 0 0 .25em; font-family: var(--font-display); }
.wheel-card p { font-size: var(--step--1); margin-bottom: .6em; }

/* ====== كرات مضيئة (من WordSpark) ====== */
.orb { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 1.05rem var(--font-body); }
.orb-gold { background: radial-gradient(circle at 35% 30%, #ffd09a, #f59a35 55%, #d9780f); box-shadow: 0 0 20px rgba(245,154,53,.5); color: #2a1200; animation: breathe 2.8s ease-in-out infinite; }
.orb-teal { background: radial-gradient(circle at 35% 30%, #7fffd4, #2dd4bf 60%, #0e9f8a); box-shadow: 0 0 18px rgba(45,212,191,.5); color: #06251f; }
.orb-dim { background: var(--flat); border: 1px solid var(--line); color: var(--ink-faint); }
.orb-c { background: var(--c); background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 40%, #fff), var(--c) 60%, color-mix(in srgb, var(--c) 70%, #000)); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 55%, transparent); color: #06151a; }
.orb[data-c="tarbawi"] { --c: var(--c-tarbawi); } .orb[data-c="ilmi"] { --c: var(--c-ilmi); } .orb[data-c="khayri"] { --c: var(--c-khayri); } .orb[data-c="mujtama"] { --c: var(--c-mujtama); }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 6px; background: var(--ink-faint); }
.dot-ok { background: #2dd4bf; box-shadow: 0 0 8px rgba(45,212,191,.7); }

function download(name, text, type) {

  a.href = URL.createObjectURL(new Blob([text], { type }));

}
